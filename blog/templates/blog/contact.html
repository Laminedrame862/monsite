   {% extends 'blog/base.html' %}

   {% block contenu %}
   <h1>Contact</h1>
   {% for m in messages %}
     <div class="alert alert-success">{{ m }}</div>
   {% endfor %}
   <form method="post">
     {% csrf_token %}
     {% for champ in form %}
       <div class="mb-3">
         <label class="form-label">{{ champ.label }}</label>
         {{ champ }}
         {{ champ.errors }}
       </div>
     {% endfor %}
     <button type="submit" class="btn btn-success">Envoyer</button>
   </form>
   {% endblock %}
